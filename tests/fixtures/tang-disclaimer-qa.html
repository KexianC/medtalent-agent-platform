<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>【模拟验收】唐劲松提示语与播报</title>
  <style>
    #qa-panel { position: fixed; z-index: 2147483647; left: 8px; top: 8px; width: min(370px, calc(100vw - 16px)); max-height: 76vh; overflow: auto; padding: 10px; border: 1px solid #b97526; border-radius: 9px; background: #fff8db; color: #48311d; box-shadow: 0 4px 18px #0002; font: 12px/1.5 sans-serif; }
    #qa-panel summary { cursor: pointer; font-weight: 700; }
    #qa-panel p { margin: 6px 0; }
    #qa-panel .qa-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0; }
    #qa-panel select, #qa-panel button { min-height: 32px; padding: 4px 7px; border: 1px solid #bfa87f; border-radius: 5px; background: white; color: inherit; font: inherit; }
    #qa-panel output, #qa-panel pre { display: block; white-space: pre-wrap; overflow-wrap: anywhere; font: 11px/1.6 monospace; }
    #qa-panel pre { max-height: 160px; margin: 5px 0; overflow: auto; }
    #qa-panel .qa-note { color: #685234; font-size: 10px; }
  </style>
</head>
<body>
  <details id="qa-panel" open>
    <summary>【模拟验收】提示语位置 / 语音过滤 · 可折叠</summary>
    <p>真实 App、本地种子医生资料，无运行中 API 依赖。合成回复、引用与静默音频；本页使用独立内存存储，不接触真实本地记录。</p>
    <div class="qa-controls">
      <label for="qa-scenario">场景</label>
      <select id="qa-scenario">
        <option value="stream-chars">正常流：提示语逐字输出 / 2 项引用</option>
        <option value="stream-split">正常流：提示语跨 delta / 2 项引用</option>
        <option value="no-citations">正常流：无引用</option>
        <option value="chat-fallback">chat stream 404 → /api/chat</option>
        <option value="tts-fallback">TTS stream 失败 → /api/tts</option>
        <option value="browser-fallback">两级 TTS 失败 → 浏览器播报</option>
      </select>
      <button id="qa-reset" type="button">清除验收证据</button>
      <button id="qa-history" type="button">载入历史回复样例</button>
      <button id="qa-inspect" type="button">检查正文与脚注</button>
    </div>
    <p class="qa-note">流式语音：开启“语音播报”，说一段合成录音后结束。文字输入可验正文，完成后点“朗读回复”验播报。历史样例请在当前回复结束后载入。</p>
    <output id="qa-counts" aria-label="请求与播报次数"></output>
    <output id="qa-checks" aria-label="正文脚注与提示语过滤检查" aria-live="polite"></output>
    <details open><summary>捕获的 TTS / 浏览器播报文字</summary><pre id="qa-speech"></pre></details>
    <details><summary>最近请求记录</summary><pre id="qa-log"></pre></details>
    <p id="qa-loading" role="status">正在加载真实 App…</p>
  </details>
  <div id="root"></div>
  <script type="module">
    // Reuses the fake recording/playback approach from tang-voice-qa.html.
    // All additions remain local to this separate, non-production fixture.
    history.replaceState(null, '', '/d/tang-jinsong/ask');
    const DISCLAIMER = '以上内容仅供健康科普参考，不构成诊断或治疗建议。';
    const BODY = '【模拟验收】可以聊今天的心情，也可以一起整理日常节奏。你想从哪件小事说起？';
    const CITATIONS = [{ title: '【模拟验收】合成资料一：日常沟通' }, { title: '【模拟验收】合成资料二：心情记录' }];
    const visitor = 'tang-disclaimer-fixture';
    const chatKey = `medtalent:${visitor}:tang-jinsong:chat-messages`;
    class MemoryStorage {
      entries = new Map();
      get length() { return this.entries.size; }
      key(index) { return [...this.entries.keys()][index] ?? null; }
      getItem(key) { return this.entries.get(String(key)) ?? null; }
      setItem(key, value) { this.entries.set(String(key), String(value)); }
      removeItem(key) { this.entries.delete(String(key)); }
      clear() { this.entries.clear(); }
    }
    const localMemory = new MemoryStorage();
    const sessionMemory = new MemoryStorage();
    localMemory.setItem('medtalent:visitor-id', visitor);
    localMemory.setItem(`medtalent:${visitor}:tang-jinsong:privacy`, JSON.stringify({ saveChat: true, voicePlayback: true, reminders: false }));
    Object.defineProperty(window, 'localStorage', { configurable: true, get: () => localMemory });
    Object.defineProperty(window, 'sessionStorage', { configurable: true, get: () => sessionMemory });

    const scenario = document.getElementById('qa-scenario');
    const counts = { doctorSeed: 0, asr: 0, chatStream: 0, chatFallback: 0, ttsStream: 0, ttsFallback: 0, browserSpeech: 0, filePlay: 0, pcmPlay: 0, blocked: 0 };
    const capturedSpeech = [];
    const logs = [];
    const tracks = new Set();
    let transientBodyLeak = false;
    const fragments = text => [...new Set(['以上', '内容仅供', '仅供健康', '健康科普', '科普参考', '不构成', '诊断或', '或治疗', '治疗建议'].filter(part => text.includes(part)))];
    function capture(channel, text) {
      capturedSpeech.push({ channel, text, fragments: fragments(text) });
      render();
    }
    function log(text) { logs.push(`${new Date().toLocaleTimeString('zh-CN', { hour12: false })} ${text}`); render(); }
    function inspectDom() {
      const rows = [...document.querySelectorAll('#root .journey-bubble-row.assistant')].filter(row => row.querySelector('.journey-message-text')?.textContent.includes('【模拟验收】'));
      const checks = rows.map((row, index) => {
        const body = row.querySelector('.journey-message-text');
        const leaked = fragments(body.textContent);
        if (leaked.length) transientBodyLeak = true;
        const notes = [...row.querySelectorAll('*')].filter(element => element.textContent.trim() === DISCLAIMER && !element.closest('.journey-message-text') && ![...element.children].some(child => child.textContent.trim() === DISCLAIMER));
        const references = row.querySelector('.journey-citations, .journey-no-citations');
        const note = notes[0];
        const noteVisible = Boolean(note?.getClientRects().length && getComputedStyle(note).visibility !== 'hidden');
        const belowReferences = note && references ? Boolean(references.compareDocumentPosition(note) & Node.DOCUMENT_POSITION_FOLLOWING) && note.getBoundingClientRect().top >= references.getBoundingClientRect().bottom - 1 : null;
        const smaller = note ? parseFloat(getComputedStyle(note).fontSize) < parseFloat(getComputedStyle(body).fontSize) : false;
        return `回复${index + 1}${row.classList.contains('is-streaming') ? '（生成中）' : ''}: 正文片段=${leaked.length ? leaked.join('/') : '无'}；脚注=${notes.length}；可见=${noteVisible}；位于资料下=${belowReferences ?? '无资料区域'}；小字=${smaller}；引用项=${row.querySelectorAll('.journey-citations li').length}`;
      });
      const spokenLeaks = capturedSpeech.filter(item => item.fragments.length);
      document.getElementById('qa-checks').textContent = `曾在正文观察到提示语片段：${transientBodyLeak ? 'FAIL' : '未观察到'}\n播报包含提示语片段：${spokenLeaks.length ? `FAIL（${spokenLeaks.length} 条）` : '未观察到'}\n${checks.length ? checks.join('\n') : '尚无合成回复。发送一次消息或载入历史样例。'}`;
    }
    function render() {
      document.getElementById('qa-counts').textContent = `本地种子GET=${counts.doctorSeed} ASR=${counts.asr} chat流=${counts.chatStream} chat回退=${counts.chatFallback}\nTTS流=${counts.ttsStream} TTS回退=${counts.ttsFallback} 浏览器=${counts.browserSpeech}\nPCM调度=${counts.pcmPlay} 文件播放=${counts.filePlay} activeTrack=${tracks.size} 阻止未知请求=${counts.blocked}`;
      document.getElementById('qa-speech').textContent = capturedSpeech.map((item, index) => `${index + 1}. ${item.channel} [${item.fragments.length ? '含提示语片段' : '无提示语片段'}]\n${item.text}`).join('\n\n') || '尚未捕获播报调用。所有通道只做静默模拟。';
      document.getElementById('qa-log').textContent = logs.slice(-10).join('\n');
      inspectDom();
    }
    document.getElementById('qa-reset').addEventListener('click', () => {
      Object.keys(counts).forEach(key => { counts[key] = 0; });
      capturedSpeech.length = 0; logs.length = 0; transientBodyLeak = false; render();
    });
    document.getElementById('qa-inspect').addEventListener('click', inspectDom);
    document.getElementById('qa-history').addEventListener('click', () => {
      const entry = { id: `fixture-history-${Date.now()}`, role: 'assistant', text: `【模拟验收】这是历史合成回复，可以聊今天的心情。\n\n${DISCLAIMER}`, createdAt: '2026-09-22T08:00:00.000Z', citations: scenario.value === 'no-citations' ? [] : CITATIONS, retrievalMode: scenario.value === 'no-citations' ? 'none' : 'hybrid' };
      const oldValue = localMemory.getItem(chatKey);
      const newValue = JSON.stringify([entry]);
      localMemory.setItem(chatKey, newValue);
      window.dispatchEvent(new StorageEvent('storage', { key: chatKey, oldValue, newValue }));
      log('已向本夹具内存存储载入历史样例；真实存储未访问。');
    });
    scenario.addEventListener('change', () => log(`场景：${scenario.selectedOptions[0].textContent}`));

    const abortError = () => new DOMException('【模拟验收】已取消', 'AbortError');
    const wait = (ms, signal) => new Promise((resolve, reject) => {
      if (signal?.aborted) { reject(abortError()); return; }
      const abort = () => { clearTimeout(timer); reject(abortError()); };
      const timer = setTimeout(() => { signal?.removeEventListener('abort', abort); resolve(); }, ms);
      signal?.addEventListener('abort', abort, { once: true });
    });
    const getUserMedia = async () => {
      const track = { readyState: 'live', kind: 'audio', stop() { this.readyState = 'ended'; tracks.delete(this); render(); } };
      tracks.add(track); render();
      return { get active() { return track.readyState === 'live'; }, getTracks: () => [track], getAudioTracks: () => [track] };
    };
    if (navigator.mediaDevices) Object.defineProperty(navigator.mediaDevices, 'getUserMedia', { configurable: true, value: getUserMedia });
    else Object.defineProperty(navigator, 'mediaDevices', { configurable: true, value: { getUserMedia } });

    class FakeAudioContext {
      sampleRate = 48000; state = 'suspended'; destination = {}; startedAt = performance.now(); elapsed = 0; processors = new Set(); sources = new Set();
      get currentTime() { return this.elapsed + (this.state === 'running' ? (performance.now() - this.startedAt) / 1000 : 0); }
      async resume() { if (this.state !== 'running') { this.startedAt = performance.now(); this.state = 'running'; } }
      async close() { this.elapsed = this.currentTime; this.state = 'closed'; this.processors.forEach(node => node.disconnect()); this.sources.forEach(node => node.stop()); }
      createMediaStreamSource(stream) { return { connect(node) { node.stream = stream; }, disconnect() {} }; }
      createScriptProcessor(size = 4096) {
        const context = this;
        const node = { stream: null, onaudioprocess: null, timer: null, connect() { this.timer = setInterval(() => { if (context.state === 'running' && this.stream?.active) this.onaudioprocess?.({ inputBuffer: { getChannelData: () => new Float32Array(size).fill(.12) } }); }, 80); }, disconnect() { clearInterval(this.timer); context.processors.delete(this); } };
        this.processors.add(node); return node;
      }
      createBuffer(channels, length, rate) { const data = Array.from({ length: channels }, () => new Float32Array(length)); return { duration: length / rate, getChannelData: index => data[index] }; }
      createBufferSource() {
        const context = this;
        const node = { buffer: null, onended: null, ended: false, timer: null, connect() {}, disconnect() {}, finish() { if (this.ended) return; this.ended = true; clearTimeout(this.timer); context.sources.delete(this); this.onended?.(); }, start(when = context.currentTime) { counts.pcmPlay += 1; render(); this.timer = setTimeout(() => this.finish(), Math.max(0, when - context.currentTime + (this.buffer?.duration || 0)) * 1000); }, stop() { this.finish(); } };
        this.sources.add(node); return node;
      }
    }
    Object.defineProperty(window, 'AudioContext', { configurable: true, value: FakeAudioContext });
    Object.defineProperty(window, 'webkitAudioContext', { configurable: true, value: FakeAudioContext });
    class FakeAudio extends EventTarget {
      constructor(src) { super(); this.src = src; }
      play() { counts.filePlay += 1; render(); this.timer = setTimeout(() => this.dispatchEvent(new Event('ended')), 220); return Promise.resolve(); }
      pause() { clearTimeout(this.timer); }
    }
    Object.defineProperty(window, 'Audio', { configurable: true, value: FakeAudio });
    class FakeUtterance { constructor(text) { this.text = text; } }
    Object.defineProperty(window, 'SpeechSynthesisUtterance', { configurable: true, value: FakeUtterance });
    let synthesisTimer;
    Object.defineProperty(window, 'speechSynthesis', { configurable: true, value: {
      speak(utterance) { counts.browserSpeech += 1; capture('speechSynthesis.speak', utterance.text); synthesisTimer = setTimeout(() => utterance.onend?.(), 220); },
      cancel() { clearTimeout(synthesisTimer); }, getVoices() { return []; },
    } });

    // Load a local Vite module, never a running platform API or live directory.
    const { doctorProfiles: seedDoctorProfiles } = await import('/src/data/doctorProfiles.ts');
    const publicDoctorProfiles = seedDoctorProfiles.map(profile => ({ ...profile, version: 'synthetic-local-seed', content: [] }));
    const encoder = new TextEncoder();
    function stream(events, signal) {
      return new Response(new ReadableStream({ async start(controller) {
        try {
          for (const { event, delay = 60 } of events) { await wait(delay, signal); controller.enqueue(encoder.encode(JSON.stringify(event) + '\n')); }
          controller.close();
        } catch (error) { controller.error(error); }
      } }), { headers: { 'Content-Type': 'application/x-ndjson; charset=utf-8', 'Cache-Control': 'no-store' } });
    }
    function chatEvents(selected) {
      const parts = selected === 'stream-split' ? ['\n\n以', '上内容仅', '供健康科普参考，', '不构成诊', '断或治疗建议', '。'] : ['\n\n', ...DISCLAIMER];
      const events = [{ event: { type: 'meta', model: 'simulated-disclaimer-qa' } }];
      for (let index = 0; index < BODY.length; index += 5) events.push({ event: { type: 'delta', text: BODY.slice(index, index + 5) }, delay: 80 });
      events.push(...parts.map(text => ({ event: { type: 'delta', text }, delay: 55 })));
      events.push({ event: { type: 'done', model: 'simulated-disclaimer-qa', citations: selected === 'no-citations' ? [] : CITATIONS, retrievalMode: selected === 'no-citations' ? 'none' : 'hybrid' }, delay: 80 });
      return events;
    }
    window.fetch = async (input, init = {}) => {
      const url = new URL(typeof input === 'string' || input instanceof URL ? input : input.url, location.href);
      const pathname = url.pathname;
      const method = (init.method || (input instanceof Request ? input.method : 'GET')).toUpperCase();
      const signal = init.signal || (input instanceof Request ? input.signal : undefined);
      const selected = scenario.value;
      const mocked = ['/api/asr', '/api/chat/stream', '/api/chat', '/api/tts/stream', '/api/tts'].includes(pathname);
      if (url.origin !== location.origin) {
        counts.blocked += 1; log('已阻止外部请求。');
        throw new Error('【模拟验收】禁止真实供应商或外部请求。');
      }
      if (signal?.aborted) throw abortError();
      if (method === 'GET' && (pathname === '/api/doctors' || pathname.startsWith('/api/doctors/'))) {
        counts.doctorSeed += 1; log(`${pathname} [本地种子资料·模拟验收]`);
        if (pathname === '/api/doctors') return Response.json(publicDoctorProfiles);
        let slug;
        try { slug = decodeURIComponent(pathname.slice('/api/doctors/'.length)); } catch { slug = ''; }
        const profile = publicDoctorProfiles.find(item => item.slug === slug);
        return profile ? Response.json(profile) : Response.json({ error: '【模拟验收】本地种子中没有该医生' }, { status: 404 });
      }
      if (!mocked || method !== 'POST') {
        counts.blocked += 1; log('已阻止未模拟的接口请求；未转发到真实 HTTP。');
        return Response.json({ error: '【模拟验收】接口未模拟，禁止真实 HTTP 回退' }, { status: mocked ? 405 : 404 });
      }
      log(`${pathname} [${selected}]`);
      if (pathname === '/api/asr') {
        counts.asr += 1; render(); await wait(120, signal);
        return Response.json({ text: '【模拟验收】请验证提示语不会被读出来。' });
      }
      if (pathname === '/api/chat/stream') {
        counts.chatStream += 1; render();
        if (selected === 'chat-fallback') return Response.json({ error: '【模拟验收】模拟流接口不存在' }, { status: 404 });
        return stream(chatEvents(selected), signal);
      }
      if (pathname === '/api/chat') {
        counts.chatFallback += 1; render(); await wait(140, signal);
        return Response.json({ reply: `${BODY}\n\n${DISCLAIMER}`, citations: CITATIONS, retrievalMode: 'hybrid' });
      }
      let payload;
      try { payload = JSON.parse(init.body || (input instanceof Request ? await input.clone().text() : '{}')); } catch { payload = {}; }
      if (pathname === '/api/tts/stream') {
        counts.ttsStream += 1; capture('/api/tts/stream', String(payload.text || ''));
        if (['tts-fallback', 'browser-fallback'].includes(selected)) return Response.json({ error: '【模拟验收】流式合成失败' }, { status: 503 });
        return stream([{ event: { type: 'audio', data: btoa('\0'.repeat(24000)), sampleRate: 24000 }, delay: 60 }, { event: { type: 'done' }, delay: 60 }], signal);
      }
      counts.ttsFallback += 1; capture('/api/tts', String(payload.text || ''));
      if (selected === 'browser-fallback') return Response.json({ error: '【模拟验收】普通合成失败' }, { status: 503 });
      await wait(60, signal);
      return new Response(new Uint8Array(44), { headers: { 'Content-Type': 'audio/wav' } });
    };

    const observer = new MutationObserver(inspectDom);
    observer.observe(document.getElementById('root'), { childList: true, characterData: true, subtree: true });
    render();
    try {
      await import('/src/main.tsx');
      document.getElementById('qa-loading').textContent = '夹具已就绪。切换场景后使用真实页面按钮；所有音频静默模拟。';
    } catch (error) {
      document.getElementById('qa-loading').textContent = `App 加载失败：${error.message}`;
      throw error;
    }
  </script>
</body>
</html>
